version: '3.8'

services:
  # IB Gateway - headless IBKR connection
  ib-gateway:
    image: ghcr.io/gnzsnz/ib-gateway:stable
    container_name: ib-gateway
    restart: unless-stopped
    network_mode: host
    environment:
      # IBKR Credentials (set in .env file)
      TWS_USERID: ${IBKR_USERNAME}
      TWS_PASSWORD: ${IBKR_PASSWORD}
      TRADING_MODE: ${IBKR_TRADING_MODE:-paper}  # paper or live
      TWS_ACCEPT_INCOMING: "accept"
      READ_ONLY_API: "no"
      VNC_SERVER_PASSWORD: ${VNC_PASSWORD:-password}
      # Handle existing session - take over from local TWS
      EXISTING_SESSION_DETECTED_ACTION: "primary"
      TWOFA_TIMEOUT_ACTION: "restart"
      # Soft-restart daily before IBKR's forced midnight restart so we don't need fresh 2FA each day
      AUTO_RESTART_TIME: "11:55 PM"
      RELOGIN_AFTER_TWOFA_TIMEOUT: "yes"
      # Multiple 2FA methods enrolled (IB Key + Mobile Authenticator) — auto-select IB Key for push
      TWOFA_DEVICE: "IB Key"
    volumes:
      - ib-gateway-data:/home/ibgateway/Jts
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/${IBKR_PORT:-4002}'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s

  # Trading Bot
  trading-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trading-bot
    restart: unless-stopped
    network_mode: host
    depends_on:
      ib-gateway:
        condition: service_healthy
    # Grant access to Docker socket (owned by root:docker, GID 988 on host)
    # so the bot can restart ib-gateway on connection failure
    group_add:
      - "${DOCKER_GID:-988}"
    environment:
      # IBKR Connection (connect via localhost since using host network)
      IBKR_HOST: 127.0.0.1
      IBKR_PORT: ${IBKR_PORT:-4002}  # 4002 for paper, 4001 for live
      IBKR_CLIENT_ID: ${IBKR_CLIENT_ID:-1}
      # IBKR_LIVE_CONFIRMED is the SINGLE switch for paper vs live trading inside
      # the bot. 'true' = real orders, anything else = dry-run. The gateway's
      # TRADING_MODE env var (set above) is separate — it configures which IBKR
      # account (paper/live) the gateway logs into, not what the bot does.
      IBKR_LIVE_CONFIRMED: ${IBKR_LIVE_CONFIRMED:-}
      # Telegram
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
      # Paths
      DB_PATH: /app/data/trading.db
      LOG_PATH: /app/logs/trading.log
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - /var/run/docker.sock:/var/run/docker.sock
    # Trading mode is controlled by IBKR_LIVE_CONFIRMED env var.
    #   IBKR_LIVE_CONFIRMED=true  -> real orders placed
    #   anything else             -> dry-run (paper_trades table only)
    command: ["python", "-m", "src.bot", "--interval", "60"]

  # Daily Instrument Screener - runs at 14:00 UTC Mon-Fri
  screener:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: screener
    restart: unless-stopped
    network_mode: host
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
      WATCHLIST_PATH: /app/data/watchlist.json
      DATA_DIR: /app/data
      LOG_DIR: /app/logs
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./screener-cron.sh:/app/screener-cron.sh:ro
    command: ["bash", "/app/screener-cron.sh"]

volumes:
  ib-gateway-data:
